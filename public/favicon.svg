<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>
  <!-- Background Circle: Warm Ivory / Pearl -->
  <circle cx="32" cy="32" r="30" fill="#FFFBF7" stroke="#FFE4E6" stroke-width="2" filter="url(#shadow)" />
  
  <!-- Elegant Wedding Tiara Crown Accent -->
  <circle cx="32" cy="14" r="1.8" fill="#F43F5E" />
  <circle cx="27" cy="16" r="1.3" fill="#FB7185" />
  <circle cx="37" cy="16" r="1.3" fill="#FB7185" />
  
  <!-- Letter A in Serif Luxury Typography -->
  <text 
    x="32" 
    y="46" 
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif" 
    font-size="34" 
    font-weight="700" 
    fill="url(#roseGrad)" 
    text-anchor="middle"
  >А</text>

  <!-- Sparkle Accent -->
  <path d="M45 22 Q46 25 49 26 Q46 27 45 30 Q44 27 41 26 Q44 25 45 22 Z" fill="#FDA4AF" />
